<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auriga WebAR Engine - Demo Oficial</title>
  
  <!-- Carga de Librerías WebAR (A-Frame 1.4.2 + MindAR 1.2.2) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Reset Global para pantalla completa en WebGL */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
      background-color: transparent !important;
    }

    video {
      object-fit: cover !important;
    }

    /* Pantalla de Carga de Auriga */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; /* Slate 900 */
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #1e293b;
      border-bottom-color: #38bdf8;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Botón Flotante de Audio */
    #audio-control-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    /* Capa UI Dinámica con Glassmorphism (Botón CTA) */
    #ui-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 85%;
      max-width: 380px;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
    }

    .auriga-cta-btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      text-align: center;
      border-radius: 50px;
      background-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease;
    }

    .auriga-cta-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Screen de Carga Oficial Auriga Engine -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 800; color: #38bdf8;">✨ Auriga WebAR Engine</h2>
    <p style="color: #94a3b8; margin: 0; font-size: 0.95rem;">Inicializando experiencia interactiva 3D...</p>
  </div>

  <!-- Botón Global de Control de Audio -->
  <button id="audio-control-btn">
    <span id="audio-icon">🔇</span>
    <span id="audio-text">Activar Audio</span>
  </button>

  <!-- Capa UI Dinámica (Llamado a la Acción de Auriga) -->
  <div id="ui-overlay">
    <a id="cta-link" href="#" target="_blank" class="auriga-cta-btn">🚀 Descubre Auriga Engine</a>
  </div>

  <!-- Contenedor WebGL -->
  <div id="webgl-container">
    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/markers/auriga.mind; autoStart: true; uiScanning: no;" 
      embedded 
      color-space="sRGB" 
      renderer="colorManagement: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- VIDEO 1: Target Index 0 (Demo Experiencia Auriga 1) -->
        <video id="ar-video-1" src="./assets/videos/video01.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        
        <!-- VIDEO 2: Target Index 1 (Demo Experiencia Auriga 2) -->
        <video id="ar-video-2" src="./assets/videos/video02.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 0 (Primer Marcador de Auriga) -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-entity-0">
        <a-video src="#ar-video-1" width="1.5" height="1.0" position="0 0 0"></a-video>
      </a-entity>

      <!-- TARGET 1 (Segundo Marcador de Auriga) -->
      <a-entity mindar-image-target="targetIndex: 1" id="target-entity-1">
        <a-video src="#ar-video-2" width="1.5" height="1.0" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Elementos DOM
      const arScene = document.getElementById("ar-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const audioBtn = document.getElementById("audio-control-btn");
      const audioIcon = document.getElementById("audio-icon");
      const audioText = document.getElementById("audio-text");
      const uiOverlay = document.getElementById("ui-overlay");
      const ctaLink = document.getElementById("cta-link");

      // Targets y Videos
      const target0 = document.getElementById("target-entity-0");
      const target1 = document.getElementById("target-entity-1");
      const video1 = document.getElementById("ar-video-1");
      const video2 = document.getElementById("ar-video-2");

      let isMuted = true;
      let activeVideo = null;

      // CONFIGURACIÓN TÉCNICA DE MARCA (Auriga Promotional Specs)
      const targetConfig = {
        0: {
          ctaText: "✨ Conoce la Plataforma Auriga",
          ctaUrl: "https://auriga.local", // O la URL del sitio oficial de Auriga
          color: "#38bdf8" // Auriga Cyan
        },
        1: {
          ctaText: "🚀 Agendar Demo Interactiva",
          ctaUrl: "https://auriga.local/contacto", // URL de contacto/cotización
          color: "#6366f1" // Indigo Tech
        }
      };

      // Control de Mute/Unmute
      audioBtn.addEventListener("click", () => {
        isMuted = !isMuted;
        video1.muted = isMuted;
        video2.muted = isMuted;

        audioIcon.innerText = isMuted ? "🔇" : "🔊";
        audioText.innerText = isMuted ? "Activar Audio" : "Audio: ON";
        audioBtn.style.background = isMuted ? "rgba(15, 23, 42, 0.85)" : "rgba(56, 189, 248, 0.9)";
        audioBtn.style.color = isMuted ? "#ffffff" : "#0f172a";
      });

      // Motor AR Listo
      arScene.addEventListener("arReady", () => {
        console.log("✅ Motor Auriga AR listo. Escaneando marcadores de la marca.");
        loadingScreen.style.display = "none";
        audioBtn.style.display = "flex";
      });

      // LÓGICA DE DETECCIÓN: Target Encontrado
      const handleTargetFound = (targetIndex, videoElement) => {
        console.log(`🎯 Marcador Auriga [Index ${targetIndex}] detectado.`);
        
        // Pausar el video no activo para liberar memoria GPU en el móvil
        if (targetIndex === 0) { video2.pause(); } else { video1.pause(); }

        activeVideo = videoElement;
        activeVideo.currentTime = 0;
        activeVideo.play().catch(e => console.log("Autoplay diferido por políticas del navegador:", e));

        // Inyectar textos, enlaces y colores dinámicos de Auriga
        const config = targetConfig[targetIndex];
        ctaLink.innerText = config.ctaText;
        ctaLink.href = config.ctaUrl;
        ctaLink.style.backgroundColor = config.color;

        // Desplegar UI flotante
        uiOverlay.style.display = "block";
        setTimeout(() => { uiOverlay.style.opacity = "1"; }, 50);
      };

      // LÓGICA DE DETECCIÓN: Target Perdido
      const handleTargetLost = (videoElement) => {
        console.log("❌ Marcador fuera del área de escaneo.");
        videoElement.pause();
        uiOverlay.style.opacity = "0";
        setTimeout(() => { uiOverlay.style.display = "none"; }, 400);
      };

      // Event Listeners
      target0.addEventListener("targetFound", () => handleTargetFound(0, video1));
      target0.addEventListener("targetLost", () => handleTargetLost(video1));

      target1.addEventListener("targetFound", () => handleTargetFound(1, video2));
      target1.addEventListener("targetLost", () => handleTargetLost(video2));
    });
  </script>
</body>
</html>
